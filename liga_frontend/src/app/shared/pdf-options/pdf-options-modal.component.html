<ion-header>
  <ion-toolbar>
    <ion-title class="liga-display">Generar reporte PDF</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrar()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="liga-field">
    <label>¿Qué quieres incluir en el PDF?</label>
    <select [(ngModel)]="categoriaSeleccionada">
      <option [ngValue]="null">Todas las categorías</option>
      <option *ngFor="let cat of categorias" [ngValue]="cat.id">
        Solo Categoría {{ cat.nombre }}
      </option>
    </select>
  </div>

  <button class="liga-btn liga-btn-block" (click)="generar()">
    <ion-icon name="download-outline"></ion-icon> Generar PDF
  </button>
</ion-content>
